name: Synchronisation Galerie Discord

on:
  workflow_dispatch: # Permet de le lancer à la main avec le bouton "Run workflow"
  schedule:
    - cron: '0 * * * *' # Se lance automatiquement toutes les heures

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configuration de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Exécuter le script de récupération
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      run: node recupere_medias.js

    - name: Mettre à jour le dépôt GitHub avec les nouvelles données
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add donnees.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des médias Discord" && git push)

    - name: Configuration de l'environnement GitHub Pages
      uses: actions/configure-pages@v4

    - name: Créer l'artefact pour le déploiement
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Déployer sur GitHub Pages
      uses: actions/deploy-pages@v4